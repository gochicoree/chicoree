# Chicorée on Coolify (Docker Compose build pack).
#
# Differences from docker-compose.yml: nothing is bind-mounted from the repo
# (the web container generates the token key pair and the Clair database on
# first start), no host ports are published (Coolify's proxy routes the two
# domains), and every secret is generated by Coolify's SERVICE_* variables.
#
# In Coolify: New resource → Docker Compose (from this repository), set
# "Docker Compose Location" to /docker-compose.coolify.yml, load it, then give
# `web` and `registryd` their domains. See README "Deploying with Coolify".

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      POSTGRES_USER: chicoree
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: chicoree
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chicoree -d chicoree"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: ./web
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      # Domain for the UI; Coolify routes it to port 3000 of this container.
      - SERVICE_URL_WEB_3000
      - APP_URL=${SERVICE_URL_WEB}
      - DATABASE_URL=postgres://chicoree:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/chicoree
      - AUTH_SECRET=${SERVICE_PASSWORD_64_AUTHSECRET}
      - WEBHOOK_SECRET=${SERVICE_HEX_64_WEBHOOKSECRET}
      - JOBS_API_TOKEN=${SERVICE_HEX_64_JOBSTOKEN}
      - JOB_SCHEDULER=${JOB_SCHEDULER:-true}
      # What users pass to `docker login` — the registryd domain, no scheme.
      - REGISTRY_HOST=${SERVICE_FQDN_REGISTRYD}
      - REGISTRY_INTERNAL_URL=http://registryd:5000
      # Generated on first start into the shared token-keys volume.
      - JWT_PRIVATE_KEY_FILE=/var/lib/chicoree/keys/registry-token.key
      - JWT_PUBLIC_KEY_FILE=/var/lib/chicoree/keys/registry-token.pub
      # Vulnerability scanner: SCANNER=off|clair|trivy (empty: clair when
      # CLAIR_URL is set, else off); Administration → Scanning overrides it.
      - SCANNER=${SCANNER:-}
      # Empty disables Clair and hides vulnerability data; then delete the
      # clair service below as well.
      - CLAIR_URL=${CLAIR_URL-http://clair:6060}
      # Trivy (SCANNER=trivy) runs inside this container against the trivy
      # service below (delete it and leave the URL empty for standalone mode).
      - TRIVY_SERVER_URL=${TRIVY_SERVER_URL-http://trivy:4954}
      - TRIVY_CACHE_DIR=/var/lib/chicoree/trivy
      - PASSKEY_RP_ID=${SERVICE_FQDN_WEB}
      - PASSKEY_RP_NAME=${PASSKEY_RP_NAME:-Chicorée Registry}
      # Email (leave SMTP_HOST empty to log mail to the container output)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-Chicorée <registry@example.com>}
      # Optional sign-in providers (see README)
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_NAME=${OIDC_NAME:-SSO}
      - OIDC_SCOPES=${OIDC_SCOPES:-openid profile email}
      - OIDC_GROUPS_CLAIM=${OIDC_GROUPS_CLAIM:-groups}
      - LDAP_URL=${LDAP_URL:-}
      - LDAP_NAME=${LDAP_NAME:-LDAP}
      - LDAP_BIND_DN=${LDAP_BIND_DN:-}
      - LDAP_BIND_PASSWORD=${LDAP_BIND_PASSWORD:-}
      - LDAP_USER_BASE=${LDAP_USER_BASE:-}
      - LDAP_USER_FILTER=${LDAP_USER_FILTER:-(&(objectClass=person)(uid={{username}}))}
      - LDAP_ATTR_EMAIL=${LDAP_ATTR_EMAIL:-mail}
      - LDAP_ATTR_NAME=${LDAP_ATTR_NAME:-cn}
      - LDAP_ATTR_GROUPS=${LDAP_ATTR_GROUPS:-memberOf}
      - LDAP_GROUP_BASE=${LDAP_GROUP_BASE:-}
      - LDAP_GROUP_FILTER=${LDAP_GROUP_FILTER:-(|(member={{dn}})(uniqueMember={{dn}})(memberUid={{username}}))}
      - LDAP_EMAIL_DOMAIN=${LDAP_EMAIL_DOMAIN:-}
      - LDAP_START_TLS=${LDAP_START_TLS:-false}
      - LDAP_TLS_INSECURE=${LDAP_TLS_INSECURE:-false}
      - AUTH_GROUP_BINDINGS=${AUTH_GROUP_BINDINGS:-}
      # Sign-up controls, branding, audit retention and pull rate limits (see README)
      - SIGNUP_MODE=${SIGNUP_MODE:-open}
      - SIGNUP_ALLOWED_DOMAINS=${SIGNUP_ALLOWED_DOMAINS:-}
      - ORG_CREATION=${ORG_CREATION:-everyone}
      - INSTANCE_NAME=${INSTANCE_NAME:-}
      - INSTANCE_TAGLINE=${INSTANCE_TAGLINE:-}
      - AUDIT_RETENTION_DAYS=${AUDIT_RETENTION_DAYS:-365}
      - RATE_LIMIT_ANONYMOUS=${RATE_LIMIT_ANONYMOUS:-}
      - RATE_LIMIT_AUTHENTICATED=${RATE_LIMIT_AUTHENTICATED:-}
      - RATE_LIMIT_TRUSTED_PROXIES=${RATE_LIMIT_TRUSTED_PROXIES:-}
    volumes:
      - token-keys:/var/lib/chicoree/keys
      - trivy-cache:/var/lib/chicoree/trivy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/sign-in"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy

  registryd:
    build: ./registryd
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      # Domain for the docker API; Coolify routes it to port 5000 here.
      - SERVICE_FQDN_REGISTRYD_5000
      - DATABASE_URL=postgres://chicoree:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/chicoree
      # Storage: filesystem on the registry-data volume, or S3 (STORAGE_DRIVER=s3).
      - STORAGE_DRIVER=${STORAGE_DRIVER:-filesystem}
      - FILESYSTEM_ROOT=/var/lib/registry
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
      - S3_REDIRECT_GET=${S3_REDIRECT_GET:-false}
      - GC_GRACE_PERIOD=${GC_GRACE_PERIOD:-1h}
      - REGISTRY_LOG_FORMAT=${REGISTRY_LOG_FORMAT:-text}
      # Pull rate limit defaults, shared with the web app (Administration → Rate limits overrides them).
      - RATE_LIMIT_ANONYMOUS=${RATE_LIMIT_ANONYMOUS:-}
      - RATE_LIMIT_AUTHENTICATED=${RATE_LIMIT_AUTHENTICATED:-}
      - RATE_LIMIT_TRUSTED_PROXIES=${RATE_LIMIT_TRUSTED_PROXIES:-}
      # Docker clients are sent here for tokens, so it is the public web URL.
      - TOKEN_REALM=${SERVICE_URL_WEB}/api/registry/token
      - TOKEN_SERVICE=chicoree-registry
      - TOKEN_ISSUER=chicoree-web
      - JWT_PUBLIC_KEY_FILE=/var/lib/chicoree/keys/registry-token.pub
      - WEBHOOK_URL=http://web:3000/api/internal/events
      - WEBHOOK_SECRET=${SERVICE_HEX_64_WEBHOOKSECRET}
    volumes:
      - registry-data:/var/lib/registry
      - token-keys:/var/lib/chicoree/keys:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:5000/internal/v1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      # web writes the public key this service verifies tokens with.
      web:
        condition: service_healthy

  clair:
    # 4.9.0's OSV updater panics on current upstream data; 4.8.0 is stable.
    image: quay.io/projectquay/clair:4.8.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # Updater downloads land in /tmp and leak when the database is
    # unreachable; a size-capped tmpfs keeps that off the disk.
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 3221225472
    environment:
      CLAIR_CONNSTRING: host=postgres port=5432 user=chicoree password=${SERVICE_PASSWORD_POSTGRES} dbname=clair sslmode=disable
    # The image expects a config file; write one from the env at start-up
    # instead of bind-mounting deploy/clair/config.yaml.
    entrypoint: ["sh", "-c"]
    command:
      - |
        cat > /tmp/config.yaml <<EOF
        http_listen_addr: ":6060"
        introspection_addr: ""
        log_level: "info"
        indexer:
          connstring: "$$CLAIR_CONNSTRING"
          scanlock_retry: 10
          layer_scan_concurrency: 5
          migrations: true
        matcher:
          connstring: "$$CLAIR_CONNSTRING"
          max_conn_pool: 100
          migrations: true
        notifier:
          connstring: "$$CLAIR_CONNSTRING"
          migrations: true
          delivery_interval: "1m"
          poll_interval: "5m"
        EOF
        exec clair -conf /tmp/config.yaml -mode combo
    depends_on:
      postgres:
        condition: service_healthy
      # web creates the clair database on first start.
      web:
        condition: service_healthy

  trivy:
    # Optional Trivy server (SCANNER=trivy): keeps the vulnerability database
    # updated for the web container's trivy client. Delete this service and
    # leave TRIVY_SERVER_URL empty to let the web container fetch the
    # database itself.
    image: aquasec/trivy:0.74.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    command: ["server", "--listen", "0.0.0.0:4954"]
    volumes:
      - trivy-server-cache:/root/.cache/trivy

volumes:
  pg-data:
  registry-data:
  token-keys:
  trivy-cache:
  trivy-server-cache:
