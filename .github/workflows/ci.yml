name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  registryd:
    name: registryd (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: registryd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: registryd/go.mod
          cache-dependency-path: registryd/go.sum
      - run: go vet ./...
      - run: go test ./...

  web:
    name: web (typecheck, API docs, build, contract tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: chicoree
          POSTGRES_PASSWORD: chicoree
          POSTGRES_DB: chicoree
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U chicoree" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://chicoree:chicoree@localhost:5432/chicoree
      AUTH_SECRET: ci-auth-secret-that-is-long-enough-for-tests
      WEBHOOK_SECRET: ci-webhook-secret
      APP_URL: http://localhost:3000
      REGISTRY_HOST: localhost:5000
      REGISTRY_INTERNAL_URL: http://localhost:5000
      JWT_PRIVATE_KEY_FILE: ${{ github.workspace }}/ci-keys/registry-token.key
      NEXT_TELEMETRY_DISABLED: "1"
      JOB_SCHEDULER: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Typecheck plus the API contract: every route has a catalog entry, the
      # OpenAPI document validates and API.md is current.
      - run: npm run lint
      - run: npm run build
      - name: Keys and migrations
        run: |
          node scripts/bootstrap.mjs
          node scripts/migrate.mjs
      - name: Start the app
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public 2>/dev/null || true
          (cd .next/standalone && PORT=3000 HOSTNAME=127.0.0.1 nohup node server.js > ../../server.log 2>&1 &)
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health > /dev/null 2>&1; then echo "up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "the app did not come up"; cat server.log; exit 1
      - name: API contract tests
        run: npm run api:smoke
        env:
          API_BASE: http://localhost:3000
      - name: Server log
        if: failure()
        run: cat server.log || true
